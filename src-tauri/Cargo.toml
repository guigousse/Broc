[package]
name = "app"
version = "1.4.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-haptics = "2"
tauri-plugin-opener = "2"
tauri-plugin-in-app-review = "0.2"
tauri-plugin-admob = { path = "vendor/tauri-plugin-admob" }
tauri-plugin-iap = { path = "vendor/tauri-plugin-iap" }
tauri-plugin-firebase = { path = "vendor/tauri-plugin-firebase" }
tauri-plugin-stockage = { path = "vendor/tauri-plugin-stockage" }

# Patch local : le crate vendoré diffère de la 2.3.3 par DEUX correctifs iOS.
#
# 1. src/models.rs — sérialisation des dates de notifs planifiées, dont le
#    format ISO-8601 (9 décimales + offset `+00:00`) était rejeté par le
#    parseur natif iOS du plugin → notifs jamais programmées sur iOS.
# 2. ios/Sources/NotificationHandler.swift — plus de `.sound` au premier plan :
#    le son d'une notification y prend la session audio iOS et interrompait le
#    contexte Web Audio de la WebView, coupant TOUT le son du jeu en pleine
#    partie jusqu'au redémarrage de l'app.
#
# À retirer si le plugin amont corrige ces deux points.
[patch.crates-io]
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification" }
